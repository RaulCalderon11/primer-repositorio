<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 2px solid #00d4ff;
        }

        .login-container h1 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .login-container p {
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #ffbe0b;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ff006e;
            border-radius: 8px;
            font-size: 16px;
            background: #0f3460;
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d4ff 0%, #ff006e 50%, #ffbe0b 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 190, 11, 0.8);
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #ffbe0b;
            text-shadow: 0 0 10px rgba(255, 190, 11, 0.5);
        }

        .error {
            color: #ff006e;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            padding: 10px;
            background: rgba(255, 0, 110, 0.1);
            border-radius: 6px;
            border-left: 3px solid #ff006e;
        }

        .info {
            background: rgba(0, 212, 255, 0.1);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #00d4ff;
            margin-bottom: 20px;
            font-size: 13px;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1><i class="fas fa-lock"></i> Panel Administrativo</h1>
        <p>Inicia sesión para acceder al panel de control</p>
        <div class="info">
            <i class="fas fa-key"></i> Usuario: <strong>admin</strong> | Contraseña: <strong>admin123</strong>
        </div>
        <div class="error" id="error"></div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // Validación de credenciales fijas
            if (username === 'admin' && password === 'admin123') {
                sessionStorage.setItem('adminUser', username);
                window.location.href = 'admin.html';
            } else {
                errorDiv.textContent = '❌ Usuario o contraseña incorrectos';
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
