<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Gestor de Tareas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: #e0e0e0;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(90deg, #00d4ff 0%, #ff006e 50%, #ffbe0b 100%);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            margin: 0;
            color: #000;
            font-weight: 700;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #000;
        }

        .logout-btn {
            background: rgba(0, 0, 0, 0.2);
            color: #000;
            border: 2px solid rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff006e;
            color: #fff;
            border-color: #ff006e;
        }

        /* ===== MAIN CONTENT ===== */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* ===== NAVIGATION UNITS ===== */
        .units-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .unit-btn {
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #00d4ff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s;
            color: #e0e0e0;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
        }

        .unit-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            border-color: #ffbe0b;
        }

        .unit-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #ffbe0b 100%);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        /* ===== UNIT CONTENT ===== */
        .unit-content {
            display: none;
        }

        .unit-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
        }

        .unit-header h2 {
            color: #ffbe0b;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 190, 11, 0.3);
        }

        .add-task-btn {
            background: linear-gradient(90deg, #00d4ff 0%, #ff006e 100%);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .add-task-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 190, 11, 0.6);
        }

        /* ===== TASKS GRID ===== */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .task-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            transition: all 0.3s;
            border: 2px solid rgba(0, 212, 255, 0.2);
        }

        .task-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            border-color: #ff006e;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .task-title {
            color: #ffbe0b;
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 190, 11, 0.3);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-actions button {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            transition: all 0.3s;
        }

        .task-actions button:hover {
            background: #00d4ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .task-week {
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .documents-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 0, 110, 0.3);
        }

        .documents-section h4 {
            color: #ff006e;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 212, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 13px;
            border-left: 3px solid #00d4ff;
        }

        .doc-actions {
            display: flex;
            gap: 6px;
        }

        .doc-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #00d4ff;
            font-size: 11px;
            transition: all 0.3s;
        }

        .doc-actions button:hover {
            color: #ffbe0b;
            text-shadow: 0 0 8px rgba(255, 190, 11, 0.5);
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #ff006e;
            padding-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
            color: #00d4ff;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #ff006e;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #ffbe0b;
            text-shadow: 0 0 10px rgba(255, 190, 11, 0.5);
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group-modal {
            display: flex;
            flex-direction: column;
        }

        .form-group-modal label {
            color: #ffbe0b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-group-modal input,
        .form-group-modal textarea {
            padding: 12px;
            border: 2px solid #ff006e;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #0f3460;
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .form-group-modal input:focus,
        .form-group-modal textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .form-group-modal textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn-cancel {
            padding: 12px 25px;
            background: rgba(255, 0, 110, 0.1);
            border: 2px solid #ff006e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #ff006e;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: #ff006e;
            color: #000;
        }

        .btn-save {
            padding: 12px 25px;
            background: linear-gradient(90deg, #00d4ff 0%, #ffbe0b 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #000;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 190, 11, 0.6);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .empty-state p {
            font-size: 18px;
            margin: 0;
            color: #b0b0b0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .units-nav {
                grid-template-columns: 1fr;
            }

            .unit-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .tasks-grid {
                grid-template-columns: 1fr;
            }

            .main-container {
                padding: 15px;
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-book"></i> Panel Administrativo - Desarrollo de Aplicaciones</h1>
            <div class="header-user">
                <button class="add-task-btn" style="background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%); margin-right: 15px;" onclick="saveData(true)"><i class="fas fa-cloud-upload-alt"></i> Forzar Guardado en Nube</button>
                <span id="userName">Admin</span>
                <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- Units Navigation -->
        <div class="units-nav" id="unitsNav"></div>

        <!-- Units Content -->
        <div id="unitsContent"></div>
    </div>

    <!-- ADD TASK MODAL -->
    <div class="modal" id="addTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Tarea</h3>
                <button class="close-btn" onclick="closeAddTaskModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleAddTask(event)">
                <div class="form-group-modal">
                    <label for="taskWeek">Semana Número</label>
                    <input type="number" id="taskWeek" min="1" placeholder="Ej: 1" required>
                </div>
                <div class="form-group-modal">
                    <label for="taskTitle">Título de la Tarea</label>
                    <input type="text" id="taskTitle" placeholder="Ej: Crear componentes" required>
                </div>
                <div class="form-group-modal">
                    <label for="taskDescription">Descripción</label>
                    <textarea id="taskDescription" placeholder="Detalla la tarea..."></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="taskDueDate">Fecha de Entrega</label>
                    <input type="date" id="taskDueDate" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddTaskModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT TASK MODAL -->
    <div class="modal" id="editTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Tarea</h3>
                <button class="close-btn" onclick="closeEditTaskModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleEditTask(event)">
                <div class="form-group-modal">
                    <label for="editTaskWeek">Semana Número</label>
                    <input type="number" id="editTaskWeek" min="1" required>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskTitle">Título de la Tarea</label>
                    <input type="text" id="editTaskTitle" required>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskDescription">Descripción</label>
                    <textarea id="editTaskDescription"></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskDueDate">Fecha de Entrega</label>
                    <input type="date" id="editTaskDueDate" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditTaskModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD DOCUMENT MODAL -->
    <div class="modal" id="addDocModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Documento</h3>
                <button class="close-btn" onclick="closeAddDocModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleAddDocument(event)">
                <div class="form-group-modal">
                    <label for="docName">Nombre del Documento</label>
                    <input type="text" id="docName" placeholder="Ej: Reporte Final" required>
                </div>
                <div class="form-group-modal">
                    <label for="docDescription">Descripción</label>
                    <textarea id="docDescription" placeholder="Describe el contenido..."></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="docLink">URL o Enlace</label>
                    <input type="url" id="docLink" placeholder="https://..." required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddDocModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Documento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Verificar si el usuario está logueado
        function checkAuth() {
            const user = sessionStorage.getItem('adminUser');
            if (!user) {
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('userName').textContent = user;
            return true;
        }

        // Cliente Supabase
        const supabaseUrl = 'https://nilgysffiuyjuguqcuij.supabase.co';
        const supabaseKey = 'sb_publishable_WhpTZyUFLdZhaqY54cEPew_VAuZMsSA';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Data structure initial
        let currentUnit = 1;
        let data = {
            units: {
                1: { title: 'Unidad 1', tasks: [] },
                2: { title: 'Unidad 2', tasks: [] },
                3: { title: 'Unidad 3', tasks: [] },
                4: { title: 'Unidad 4', tasks: [] }
            }
        };

        // Load data from Supabase
        async function loadData() {
            try {
                const { data: appData, error } = await supabaseClient
                    .from('app_state')
                    .select('data')
                    .eq('id', 1)
                    .single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Error fetching data from Supabase:', error);
                } else if (appData && appData.data && appData.data.units) {
                    // Validar que el JSON realmente contenga units
                    data = appData.data;
                } else if (appData && (!appData.data || !appData.data.units)) {
                    console.warn('Datos en Supabase incompletos o vacíos. Usando plantilla local por defecto. Intenta guardar una tarea para inicializar.');
                }
            } catch (err) {
                console.error('Unexpected error loading data:', err);
            }
        }

        // Save data to Supabase
        async function saveData(showFeedback = false) {
            try {
                // Mensaje si lo activó manualmente
                if(showFeedback) {
                    console.log('Subiendo a Supabase...');
                }

                const { error } = await supabaseClient
                    .from('app_state')
                    .upsert({ id: 1, data: data });

                if (error) {
                    console.error('Error saving data to Supabase:', error);
                    alert("Hubo un error al guardar en Supabase. Revisa Row Level Security (RLS) en sus políticas:\n" + error.message);
                } else {
                    if(showFeedback) {
                        alert("✅ Tareas y Unidades guardadas exitosamente en tu base de datos Supabase.");
                    }
                }
            } catch (err) {
                console.error('Unexpected error saving data:', err);
                if(showFeedback) alert("Error inesperado de red.");
            }
        }

        // LOGOUT
        function handleLogout() {
            sessionStorage.removeItem('adminUser');
            window.location.href = 'index.html';
        }

        // Render units navigation
        function renderUnits() {
            const container = document.getElementById('unitsNav');
            const contentContainer = document.getElementById('unitsContent');
            container.innerHTML = '';
            contentContainer.innerHTML = '';

            Object.keys(data.units).forEach(unitId => {
                const unit = data.units[unitId];

                // Navigation button
                const btn = document.createElement('button');
                btn.className = `unit-btn ${unitId == currentUnit ? 'active' : ''}`;
                btn.textContent = unit.title;
                btn.onclick = () => switchUnit(unitId);
                container.appendChild(btn);

                // Content section
                const content = document.createElement('div');
                content.className = `unit-content ${unitId == currentUnit ? 'active' : ''}`;
                content.id = `unit-${unitId}`;
                content.innerHTML = `
                    <div class="unit-header">
                        <h2>${unit.title}</h2>
                        <button class="add-task-btn" onclick="openAddTaskModal(${unitId})">
                            <i class="fas fa-plus"></i> Agregar Tarea
                        </button>
                    </div>
                    <div class="tasks-grid" id="tasks-${unitId}"></div>
                `;
                contentContainer.appendChild(content);
            });

            renderTasks();
        }

        // Switch unit
        function switchUnit(unitId) {
            currentUnit = unitId;

            document.querySelectorAll('.unit-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 1) == unitId);
            });

            document.querySelectorAll('.unit-content').forEach((content, idx) => {
                content.classList.toggle('active', (idx + 1) == unitId);
            });

            renderTasks();
        }

        // Render tasks for current unit
        function renderTasks() {
            const tasks = data.units[currentUnit].tasks;
            const container = document.getElementById(`tasks-${currentUnit}`);

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No hay tareas aún. ¡Agrega una nueva!</p>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map((task, idx) => `
                <div class="task-card">
                    <div class="task-header">
                        <h3 class="task-title">${task.title}</h3>
                        <div class="task-actions">
                            <button onclick="openEditTaskModal(${currentUnit}, ${idx})" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteTask(${currentUnit}, ${idx})" title="Eliminar" style="color: #ff6b6b;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="task-week">📅 Semana ${task.week}</div>
                    <p style="color: #666; font-size: 14px; margin-bottom: 12px;">${task.description || 'Sin descripción'}</p>
                    <p style="color: #999; font-size: 13px;">Entrega: <strong>${new Date(task.dueDate).toLocaleDateString('es-ES')}</strong></p>
                    
                    <div class="documents-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <h4>📄 Documentos (${task.documents ? task.documents.length : 0})</h4>
                            <button style="background: #667eea; color: white; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer;" onclick="openAddDocModal(${currentUnit}, ${idx})">
                                + Agregar
                            </button>
                        </div>
                        ${task.documents && task.documents.length > 0 ? task.documents.map((doc, docIdx) => `
                            <div class="doc-item">
                                <span>
                                    <strong>${doc.name}</strong><br>
                                    <small>${doc.description}</small>
                                </span>
                                <div class="doc-actions">
                                    <button onclick="downloadDocument('${doc.name}', '${doc.link}')" title="Descargar">
                                        <i class="fas fa-download"></i> Descargar
                                    </button>
                                    <button onclick="deleteDocument(${currentUnit}, ${idx}, ${docIdx})" title="Eliminar" style="color: #ff6b6b;">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('') : '<p style="color: #999; font-size: 13px; text-align: center; padding: 10px;">Sin documentos</p>'}
                    </div>
                </div>
            `).join('');
        }

        // Modal functions
        let currentEditingTask = { unitId: null, taskIdx: null };

        function openAddTaskModal(unitId) {
            if (data.units[unitId].tasks.length >= 4) {
                alert('Máximo 4 tareas por unidad');
                return;
            }
            currentEditingTask = { unitId, taskIdx: null };
            document.getElementById('addTaskModal').classList.add('show');
        }

        function closeAddTaskModal() {
            document.getElementById('addTaskModal').classList.remove('show');
            document.getElementById('taskWeek').value = '';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskDueDate').value = '';
        }

        function handleAddTask(event) {
            event.preventDefault();
            const task = {
                week: parseInt(document.getElementById('taskWeek').value),
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                dueDate: document.getElementById('taskDueDate').value,
                documents: []
            };

            data.units[currentEditingTask.unitId].tasks.push(task);
            saveData();
            renderTasks();
            closeAddTaskModal();
        }

        function openEditTaskModal(unitId, taskIdx) {
            currentEditingTask = { unitId, taskIdx };
            const task = data.units[unitId].tasks[taskIdx];
            document.getElementById('editTaskWeek').value = task.week;
            document.getElementById('editTaskTitle').value = task.title;
            document.getElementById('editTaskDescription').value = task.description;
            document.getElementById('editTaskDueDate').value = task.dueDate;
            document.getElementById('editTaskModal').classList.add('show');
        }

        function closeEditTaskModal() {
            document.getElementById('editTaskModal').classList.remove('show');
        }

        function handleEditTask(event) {
            event.preventDefault();
            const task = data.units[currentEditingTask.unitId].tasks[currentEditingTask.taskIdx];
            task.week = parseInt(document.getElementById('editTaskWeek').value);
            task.title = document.getElementById('editTaskTitle').value;
            task.description = document.getElementById('editTaskDescription').value;
            task.dueDate = document.getElementById('editTaskDueDate').value;
            saveData();
            renderTasks();
            closeEditTaskModal();
        }

        function deleteTask(unitId, taskIdx) {
            if (confirm('¿Estás seguro de que deseas eliminar esta tarea?')) {
                data.units[unitId].tasks.splice(taskIdx, 1);
                saveData();
                renderTasks();
            }
        }

        function openAddDocModal(unitId, taskIdx) {
            currentEditingTask = { unitId, taskIdx };
            document.getElementById('addDocModal').classList.add('show');
        }

        function closeAddDocModal() {
            document.getElementById('addDocModal').classList.remove('show');
            document.getElementById('docName').value = '';
            document.getElementById('docDescription').value = '';
            document.getElementById('docLink').value = '';
        }

        function handleAddDocument(event) {
            event.preventDefault();
            const doc = {
                name: document.getElementById('docName').value,
                description: document.getElementById('docDescription').value,
                link: document.getElementById('docLink').value
            };

            const task = data.units[currentEditingTask.unitId].tasks[currentEditingTask.taskIdx];
            if (!task.documents) task.documents = [];
            task.documents.push(doc);
            saveData();
            renderTasks();
            closeAddDocModal();
        }

        function deleteDocument(unitId, taskIdx, docIdx) {
            if (confirm('¿Eliminar este documento?')) {
                data.units[unitId].tasks[taskIdx].documents.splice(docIdx, 1);
                saveData();
                renderTasks();
            }
        }

        function downloadDocument(name, link) {
            if (link.startsWith('http')) {
                window.open(link, '_blank');
            } else {
                alert('Enlace inválido');
            }
        }

        // Close modals on background click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        });

        // Initialize
        if (checkAuth()) {
            loadData().then(() => {
                renderUnits();
            });
        }
    </script>
</body>

</html>
