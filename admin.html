<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - UPLA</title>
    <!-- Incluimos Tailwind CSS y FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --hk-bg-dark: #020611;
            --hk-bg-light: #0a1128;
            --hk-cyan: #00e5ff;
            --hk-cyan-dim: rgba(0, 229, 255, 0.3);
            --hk-soul: #e2f1f8;
            --hk-border: #4da8da;
            --hk-panel: rgba(13, 27, 42, 0.75);
            --hk-danger: #ff4a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Spectral', serif;
            background: linear-gradient(135deg, var(--hk-bg-dark) 0%, var(--hk-bg-light) 100%);
            color: var(--hk-soul);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        .cinzel {
            font-family: 'Cinzel Decorative', serif;
            letter-spacing: 1px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(2, 6, 17, 0.85);
            border-bottom: 1px solid var(--hk-cyan);
            box-shadow: 0 0 20px var(--hk-cyan-dim);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            margin: 0;
            color: var(--hk-soul);
            font-weight: 700;
            text-shadow: 0 0 10px var(--hk-cyan);
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--hk-soul);
            font-family: 'Cinzel Decorative', serif;
        }

        .logout-btn {
            background: transparent;
            color: var(--hk-cyan);
            border: 1px solid var(--hk-cyan);
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Cinzel Decorative', serif;
        }

        .logout-btn:hover {
            background: var(--hk-cyan-dim);
            color: #fff;
            box-shadow: 0 0 15px var(--hk-cyan);
        }

        /* ===== MAIN CONTENT ===== */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* ===== NAVIGATION UNITS ===== */
        .units-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .unit-btn {
            padding: 20px;
            background: var(--hk-panel);
            border: 1px solid var(--hk-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s;
            color: var(--hk-soul);
            font-family: 'Cinzel Decorative', serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .unit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 20px var(--hk-cyan-dim);
            border-color: var(--hk-cyan);
            color: var(--hk-cyan);
            text-shadow: 0 0 5px var(--hk-cyan-dim);
        }

        .unit-btn.active {
            background: rgba(0, 229, 255, 0.1);
            color: var(--hk-cyan);
            border-color: var(--hk-cyan);
            box-shadow: 0 0 25px var(--hk-cyan-dim) inset;
            text-shadow: 0 0 8px var(--hk-cyan);
        }

        /* ===== UNIT CONTENT ===== */
        .unit-content {
            display: none;
        }

        .unit-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--hk-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--hk-cyan);
            backdrop-filter: blur(5px);
        }

        .unit-header h2 {
            color: var(--hk-cyan);
            margin: 0;
            text-shadow: 0 0 10px var(--hk-cyan-dim);
        }

        .add-task-btn {
            background: transparent;
            color: var(--hk-cyan);
            border: 1px solid var(--hk-cyan);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-family: 'Cinzel Decorative', serif;
            box-shadow: 0 0 10px var(--hk-cyan-dim) inset;
        }

        .add-task-btn:hover {
            transform: translateY(-2px);
            background: var(--hk-cyan-dim);
            color: #fff;
            box-shadow: 0 0 20px var(--hk-cyan);
        }

        /* ===== TASKS GRID ===== */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .task-card {
            background: var(--hk-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            border: 1px solid var(--hk-border);
        }

        .task-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 25px var(--hk-cyan-dim);
            border-color: var(--hk-cyan);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .task-title {
            color: var(--hk-cyan);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
            font-family: 'Cinzel Decorative', serif;
            text-shadow: 0 0 8px var(--hk-cyan-dim);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-actions button {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid var(--hk-cyan);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hk-cyan);
            transition: all 0.3s;
        }

        .task-actions button:hover {
            background: var(--hk-cyan-dim);
            color: #fff;
            box-shadow: 0 0 10px var(--hk-cyan);
        }

        .task-week {
            color: var(--hk-cyan);
            font-size: 14px;
            margin-bottom: 12px;
            font-family: 'Cinzel Decorative', serif;
        }

        .documents-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--hk-cyan-dim);
        }

        .documents-section h4 {
            color: var(--hk-cyan);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-family: 'Cinzel Decorative', serif;
        }

        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 27, 42, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            color: #b0c4de;
            font-size: 14px;
            border-left: 2px solid var(--hk-cyan);
        }

        .doc-actions {
            display: flex;
            gap: 8px;
        }

        .doc-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--hk-border);
            font-size: 13px;
            transition: all 0.3s;
        }

        .doc-actions button:hover {
            color: var(--hk-cyan);
            text-shadow: 0 0 8px var(--hk-cyan);
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 17, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--hk-bg-light);
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--hk-cyan);
            box-shadow: 0 0 40px var(--hk-cyan-dim);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--hk-border);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
            color: var(--hk-soul);
            font-size: 22px;
            font-family: 'Cinzel Decorative', serif;
            text-shadow: 0 0 10px var(--hk-cyan);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 32px;
            cursor: pointer;
            color: var(--hk-border);
            transition: all 0.3s;
            font-family: 'Spectral', serif;
        }

        .close-btn:hover {
            color: var(--hk-cyan);
            text-shadow: 0 0 15px var(--hk-cyan);
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group-modal {
            display: flex;
            flex-direction: column;
        }

        .form-group-modal label {
            color: var(--hk-cyan);
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Cinzel Decorative', serif;
        }

        .form-group-modal input,
        .form-group-modal textarea {
            padding: 12px;
            border: 1px solid var(--hk-border);
            border-radius: 4px;
            font-size: 15px;
            font-family: 'Spectral', serif;
            background: rgba(2, 6, 17, 0.8);
            color: var(--hk-soul);
            transition: all 0.3s;
        }

        .form-group-modal input:focus,
        .form-group-modal textarea:focus {
            outline: none;
            border-color: var(--hk-cyan);
            box-shadow: 0 0 15px var(--hk-cyan-dim);
        }

        .form-group-modal textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--hk-border);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            color: var(--hk-border);
            transition: all 0.3s;
            font-family: 'Cinzel Decorative', serif;
        }

        .btn-cancel:hover {
            background: rgba(255, 74, 74, 0.2);
            color: var(--hk-danger);
            border-color: var(--hk-danger);
            box-shadow: 0 0 10px rgba(255, 74, 74, 0.4);
        }

        .btn-save {
            padding: 10px 25px;
            background: transparent;
            border: 1px solid var(--hk-cyan);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            color: var(--hk-cyan);
            transition: all 0.3s;
            font-family: 'Cinzel Decorative', serif;
            box-shadow: 0 0 10px var(--hk-cyan-dim) inset;
        }

        .btn-save:hover {
            background: var(--hk-cyan-dim);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--hk-cyan);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--hk-border);
            font-family: 'Spectral', serif;
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 20px;
            color: var(--hk-cyan-dim);
            filter: drop-shadow(0 0 8px var(--hk-cyan-dim));
        }

        .empty-state p {
            font-size: 1.2rem;
            margin: 0;
            color: #b0c4de;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header-user {
                flex-wrap: wrap;
                justify-content: center;
            }

            .units-nav {
                grid-template-columns: 1fr;
            }

            .unit-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .tasks-grid {
                grid-template-columns: 1fr;
            }

            .main-container {
                padding: 15px;
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-book"></i> Panel Administrativo - Desarrollo de Aplicaciones</h1>
            <div class="header-user">
                <button class="add-task-btn"
                    style="background: transparent; color: var(--hk-cyan); border: 1px solid var(--hk-cyan); margin-right: 15px;"
                    onclick="saveData(true)"><i class="fas fa-cloud-upload-alt"></i> Forzar Guardado</button>
                <span id="userName">Admin</span>
                <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Cerrar
                    Sesión</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- Units Navigation -->
        <div class="units-nav" id="unitsNav"></div>

        <!-- Units Content -->
        <div id="unitsContent"></div>
    </div>

    <!-- ADD TASK MODAL -->
    <div class="modal" id="addTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Tarea</h3>
                <button class="close-btn" onclick="closeAddTaskModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleAddTask(event)">
                <div class="form-group-modal">
                    <label for="taskWeek">Semana Número</label>
                    <input type="number" id="taskWeek" min="1" placeholder="Ej: 1" required>
                </div>
                <div class="form-group-modal">
                    <label for="taskTitle">Título de la Tarea</label>
                    <input type="text" id="taskTitle" placeholder="Ej: Crear componentes" required>
                </div>
                <div class="form-group-modal">
                    <label for="taskDescription">Descripción</label>
                    <textarea id="taskDescription" placeholder="Detalla la tarea..."></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="taskDueDate">Fecha de Entrega</label>
                    <input type="date" id="taskDueDate" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddTaskModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT TASK MODAL -->
    <div class="modal" id="editTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Tarea</h3>
                <button class="close-btn" onclick="closeEditTaskModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleEditTask(event)">
                <div class="form-group-modal">
                    <label for="editTaskWeek">Semana Número</label>
                    <input type="number" id="editTaskWeek" min="1" required>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskTitle">Título de la Tarea</label>
                    <input type="text" id="editTaskTitle" required>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskDescription">Descripción</label>
                    <textarea id="editTaskDescription"></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="editTaskDueDate">Fecha de Entrega</label>
                    <input type="date" id="editTaskDueDate" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditTaskModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD DOCUMENT MODAL -->
    <div class="modal" id="addDocModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Documento</h3>
                <button class="close-btn" onclick="closeAddDocModal()">&times;</button>
            </div>
            <form class="modal-form" onsubmit="handleAddDocument(event)">
                <div class="form-group-modal">
                    <label for="docName">Nombre del Documento</label>
                    <input type="text" id="docName" placeholder="Ej: Reporte Final" required>
                </div>
                <div class="form-group-modal">
                    <label for="docDescription">Descripción</label>
                    <textarea id="docDescription" placeholder="Describe el contenido..."></textarea>
                </div>
                <div class="form-group-modal">
                    <label for="docFile">Archivo PDF o Presentación</label>
                    <input type="file" id="docFile" accept=".pdf,.pptx" required>
                    <small style="color: var(--hk-cyan); margin-top: 5px;">Se subirá a tu bucket de Supabase</small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddDocModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Documento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Verificar si el usuario está logueado
        function checkAuth() {
            const user = sessionStorage.getItem('adminUser');
            if (!user) {
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('userName').textContent = user;
            return true;
        }

        // Cliente Supabase
        const supabaseUrl = 'https://nilgysffiuyjuguqcuij.supabase.co';
        const supabaseKey = 'sb_publishable_WhpTZyUFLdZhaqY54cEPew_VAuZMsSA';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Data structure initial
        let currentUnit = 1;
        let data = {
            units: {
                1: {
                    title: 'Unidad 1: Fundamentos y Modelo Relacional',
                    tasks: [

                            ]
                        },
                        {

                            week: 2,
                            description: 'resolución de 3 actividades manual resumen de la clase con cuadro comparativo y la resolución de los ejercicios propuestos entidad relacion',
                            dueDate: '2026-04-20',
                            documents: [
                                { name: 'Arquitecturas de Base de Datos.pdf', description: 'Lectura de Arquitecturas', link: 'unidad1/semana2/Arquitecturas de Base de Datos.pdf' },
                                { name: 'MODELO ENTIDAD RELACION.pdf', description: 'Modelo Entidad Relación', link: 'unidad1/semana2/MODELO ENTIDAD RELACION.pdf' },
                                { name: 'Manual de Instalación SQL Server 2025.pdf', description: 'Instalación SQL', link: 'unidad1/semana2/Manual de Instalación SQL Server 2025.pdf' },
                                { name: 'tabla coparativa.jpeg', description: 'Tabla Comparativa', link: 'unidad1/semana2/tabla coparativa.jpeg' }
                            ]
                        },
                        {
                            title: 'Diseño de Arquitectura de BD',
                            week: 3,
                            description: 'Sin descripción',
                            dueDate: '2026-04-29',
                            documents: [
                                { name: 'Arquitecturas de Base de Datos.pdf', description: 'Lectura', link: 'unidad1/semana3/Arquitecturas de Base de Datos.pdf' },
                                { name: 'Diagramas.png', description: 'Diagramas', link: 'unidad1/semana3/Diagramas.png' },
                                { name: 'Relacion_Data_Arquitectura.pdf', description: 'Relación Data', link: 'unidad1/semana3/Relacion_Data_Arquitectura.pdf' }
                            ]
                        },
                        {
                            title: 'Tipos de Arquitectura de BD',
                            week: 4,
                            description: 'Sin descripción',
                            dueDate: '2026-05-06',
                            documents: [
                                { name: 'Database_Architecture_Roadmap.pdf', description: 'Roadmap', link: 'unidad1/semana4/Database_Architecture_Roadmap.pdf' },
                                { name: 'Normalización_de_Bases_de_Datos.pdf', description: 'Normalización', link: 'unidad1/semana4/Normalización_de_Bases_de_Datos.pdf' },
                                { name: 'tarea de nromalizacion.pdf', description: 'Tarea', link: 'unidad1/semana4/tarea de nromalizacion.pdf' }
                            ]
                        }
                    ]
                },
                2: { title: 'Unidad 2: Diseño Avanzado de Bases de Datos', tasks: [] },
                3: { title: 'Unidad 3: Programación en Base de Datos', tasks: [] },
                4: { title: 'Unidad 4: Administración y Seguridad', tasks: [] }
            }
        };

        const weekNames = {
            1: "Introducción a la arquitectura de BD",
            2: "Gestores de BD",
            3: "Diseño de Arquitectura de BD",
            4: "Tipos de Arquitectura de BD"
        };

        // Ya no cargamos desde Supabase, usamos los datos locales.
        async function loadData() {
            // Se mantiene la función por compatibilidad con el inicio.
            return Promise.resolve();
        }



        // Save data localmente (ya no a Supabase)
        async function saveData(showFeedback = false) {
            // Guardamos localmente en la memoria (no persiste al recargar a menos que usemos localStorage,
            // pero el usuario pidió dejar la base de datos).
            if (showFeedback) {
                alert("Guardado en memoria exitoso.");
            }
            return Promise.resolve();
        }

        // LOGOUT
        function handleLogout() {
            sessionStorage.removeItem('adminUser');
            window.location.href = 'index.html';
        }

        // Render units navigation
        function renderUnits() {
            const container = document.getElementById('unitsNav');
            const contentContainer = document.getElementById('unitsContent');
            container.innerHTML = '';
            contentContainer.innerHTML = '';

            Object.keys(data.units).forEach(unitId => {
                const unit = data.units[unitId];

                // Navigation button
                const btn = document.createElement('button');
                btn.className = `unit-btn ${unitId == currentUnit ? 'active' : ''}`;
                btn.textContent = unit.title;
                btn.onclick = () => switchUnit(unitId);
                container.appendChild(btn);

                // Content section
                const content = document.createElement('div');
                content.className = `unit-content ${unitId == currentUnit ? 'active' : ''}`;
                content.id = `unit-${unitId}`;
                content.innerHTML = `
                    <div class="unit-header">
                        <h2>${unit.title}</h2>
                        <button class="add-task-btn" onclick="openAddTaskModal(${unitId})">
                            <i class="fas fa-plus"></i> Agregar Tarea
                        </button>
                    </div>
                    <div class="tasks-grid" id="tasks-${unitId}"></div>
                `;
                contentContainer.appendChild(content);
            });

            renderTasks();
        }

        // Switch unit
        function switchUnit(unitId) {
            currentUnit = unitId;

            document.querySelectorAll('.unit-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 1) == unitId);
            });

            document.querySelectorAll('.unit-content').forEach((content, idx) => {
                content.classList.toggle('active', (idx + 1) == unitId);
            });

            renderTasks();
        }

        // Render tasks for current unit
        function renderTasks() {
            const tasks = data.units[currentUnit].tasks;
            const container = document.getElementById(`tasks-${currentUnit}`);

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No hay tareas aún. ¡Agrega una nueva!</p>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map((task, idx) => `
                <div class="task-card">
                    <div class="task-header">
                        <h3 class="task-title">${weekNames[task.week] ? 'S' + task.week + ': ' + weekNames[task.week] : task.title}</h3>
                        <div class="task-actions">
                            <button onclick="openEditTaskModal(${currentUnit}, ${idx})" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteTask(${currentUnit}, ${idx})" title="Eliminar" style="color: var(--hk-danger);">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="task-week">📅 Semana ${task.week}</div>
                    <p style="color: #b0c4de; font-size: 14px; margin-bottom: 12px;">${task.description || 'Sin descripción'}</p>
                    <p style="color: #4da8da; font-size: 13px;">Entrega: <strong>${new Date(task.dueDate).toLocaleDateString('es-ES')}</strong></p>
                    
                    <div class="documents-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <h4>📄 Documentos (${task.documents ? task.documents.length : 0})</h4>
                            <button style="background: transparent; color: var(--hk-cyan); border: 1px solid var(--hk-cyan); border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: 'Cinzel Decorative', serif;" onclick="openAddDocModal(${currentUnit}, ${idx})">
                                + Agregar
                            </button>
                        </div>
                        ${task.documents && task.documents.length > 0 ? task.documents.map((doc, docIdx) => `
                            <div class="doc-item">
                                <span>
                                    <strong>${doc.name}</strong><br>
                                    <small style="color: rgba(176, 196, 222, 0.7);">${doc.description}</small>
                                </span>
                                <div class="doc-actions">
                                    <button onclick="downloadDocument('${doc.name}', '${doc.link}')" title="Descargar">
                                        <i class="fas fa-download"></i> Descargar
                                    </button>
                                    <button onclick="deleteDocument(${currentUnit}, ${idx}, ${docIdx})" title="Eliminar" style="color: var(--hk-danger);">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('') : '<p style="color: rgba(176, 196, 222, 0.5); font-size: 13px; text-align: center; padding: 10px;">Sin documentos</p>'}
                    </div>
                </div>
            `).join('');
        }

        // Modal functions
        let currentEditingTask = { unitId: null, taskIdx: null };

        function openAddTaskModal(unitId) {
            if (data.units[unitId].tasks.length >= 4) {
                alert('Máximo 4 tareas por unidad');
                return;
            }
            currentEditingTask = { unitId, taskIdx: null };
            document.getElementById('addTaskModal').classList.add('show');
        }

        function closeAddTaskModal() {
            document.getElementById('addTaskModal').classList.remove('show');
            document.getElementById('taskWeek').value = '';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskDueDate').value = '';
        }

        function handleAddTask(event) {
            event.preventDefault();
            const task = {
                week: parseInt(document.getElementById('taskWeek').value),
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                dueDate: document.getElementById('taskDueDate').value,
                documents: []
            };

            data.units[currentEditingTask.unitId].tasks.push(task);
            saveData();
            renderTasks();
            closeAddTaskModal();
        }

        function openEditTaskModal(unitId, taskIdx) {
            currentEditingTask = { unitId, taskIdx };
            const task = data.units[unitId].tasks[taskIdx];
            document.getElementById('editTaskWeek').value = task.week;
            document.getElementById('editTaskTitle').value = task.title;
            document.getElementById('editTaskDescription').value = task.description;
            document.getElementById('editTaskDueDate').value = task.dueDate;
            document.getElementById('editTaskModal').classList.add('show');
        }

        function closeEditTaskModal() {
            document.getElementById('editTaskModal').classList.remove('show');
        }

        function handleEditTask(event) {
            event.preventDefault();
            const task = data.units[currentEditingTask.unitId].tasks[currentEditingTask.taskIdx];
            task.week = parseInt(document.getElementById('editTaskWeek').value);
            task.title = document.getElementById('editTaskTitle').value;
            task.description = document.getElementById('editTaskDescription').value;
            task.dueDate = document.getElementById('editTaskDueDate').value;
            saveData();
            renderTasks();
            closeEditTaskModal();
        }

        function deleteTask(unitId, taskIdx) {
            if (confirm('¿Estás seguro de que deseas eliminar esta tarea?')) {
                data.units[unitId].tasks.splice(taskIdx, 1);
                saveData();
                renderTasks();
            }
        }

        function openAddDocModal(unitId, taskIdx) {
            currentEditingTask = { unitId, taskIdx };
            document.getElementById('addDocModal').classList.add('show');
        }

        function closeAddDocModal() {
            document.getElementById('addDocModal').classList.remove('show');
            document.getElementById('docName').value = '';
            document.getElementById('docDescription').value = '';
            document.getElementById('docFile').value = '';
        }

        async function handleAddDocument(event) {
            event.preventDefault();
            const fileInput = document.getElementById('docFile');
            const file = fileInput.files[0];

            if (!file) {
                alert("Por favor selecciona un archivo.");
                return;
            }

            const docName = document.getElementById('docName').value;
            const docDesc = document.getElementById('docDescription').value;
            const submitBtn = event.target.querySelector('.btn-save');

            // UI feedback
            submitBtn.textContent = 'Subiendo a la nube...';
            submitBtn.disabled = true;

            try {
                // Generate a unique filename to prevent overwriting
                const fileExt = file.name.split('.').pop();
                const uniqueFileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `unidad${currentEditingTask.unitId}/${uniqueFileName}`;

                // Upload to Supabase Storage bucket named 'documentos_upla'
                const { error: uploadError } = await supabaseClient.storage
                    .from('documentos_upla')
                    .upload(filePath, file);

                if (uploadError) {
                    throw uploadError;
                }

                // Get public URL
                const { data: publicUrlData } = supabaseClient.storage
                    .from('documentos_upla')
                    .getPublicUrl(filePath);

                const publicURL = publicUrlData.publicUrl;

                // Create document object
                const doc = {
                    name: docName,
                    description: docDesc,
                    link: publicURL
                };

                const task = data.units[currentEditingTask.unitId].tasks[currentEditingTask.taskIdx];
                if (!task.documents) task.documents = [];
                task.documents.push(doc);

                await saveData();
                renderTasks();
                closeAddDocModal();
            } catch (error) {
                console.error("Error subiendo el documento:", error);
                alert("Error al subir archivo: " + error.message + "\\n\\n¿Aseguraste crear el bucket 'documentos_upla' y hacerlo público en Supabase Storage?");
            } finally {
                submitBtn.textContent = 'Guardar Documento';
                submitBtn.disabled = false;
            }
        }

        function deleteDocument(unitId, taskIdx, docIdx) {
            if (confirm('¿Eliminar este documento?')) {
                data.units[unitId].tasks[taskIdx].documents.splice(docIdx, 1);
                saveData();
                renderTasks();
            }
        }

        function downloadDocument(name, link) {
            if (link.startsWith('http')) {
                window.open(link, '_blank');
            } else {
                alert('Enlace inválido');
            }
        }

        // Close modals on background click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        });

        // Initialize
        if (checkAuth()) {
            loadData().then(() => {
                renderUnits();
            });
        }
    </script>
</body>

</html>
